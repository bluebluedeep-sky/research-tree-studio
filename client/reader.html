<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地论文阅读</title>
  <style>
    :root{color-scheme:light;--ink:#17211d;--muted:#637068;--line:#ccd8d0;--accent:#007c70;--paper:#fff;--bg:#eef3ef;--danger:#a23c35;--warn:#9c5638}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}header{min-height:64px;display:flex;align-items:center;gap:8px;padding:8px 18px;background:var(--paper);border-bottom:1px solid var(--line)}button,a.action{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 11px;text-decoration:none;cursor:pointer;font:inherit;border-radius:4px}button:hover,a.action:hover{border-color:var(--accent)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{color:var(--danger)}.title{min-width:0;flex:1}.title strong,.title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{color:var(--muted);font-size:12px}main{height:calc(100vh - 64px)}iframe{display:block;width:100%;height:100%;border:0;background:#777}.fallback{width:min(820px,calc(100% - 28px));margin:34px auto;background:#fff;border-left:4px solid var(--accent);padding:20px}.fallback.locked{border-left-color:var(--warn)}.fallback h1{font-size:21px;margin:0 0 6px}.fallback p{color:var(--muted);margin:7px 0}.fallback .abstract{padding:11px 0;border-top:1px solid var(--line);color:var(--ink);white-space:pre-wrap}.fallback-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.status-line{font-weight:700;color:var(--accent)}.replace-panel{position:fixed;z-index:3;right:14px;top:76px;width:min(430px,calc(100% - 28px));background:#fff;border:1px solid var(--line);box-shadow:0 12px 34px #17211d26;padding:14px}.replace-panel strong,.replace-panel span{display:block}.replace-panel span{margin:4px 0 12px;color:var(--muted);overflow-wrap:anywhere}.replace-actions{display:flex;justify-content:flex-end;gap:8px}.progress{height:5px;margin:10px 0;background:#dfe7e1;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--accent);transition:width .2s}.progress-stage{font-size:12px;color:var(--accent)}.message{position:fixed;left:50%;bottom:18px;z-index:5;transform:translateX(-50%);background:#17211d;color:#fff;padding:9px 14px;display:none}.message.show{display:block}[hidden]{display:none!important}@media(max-width:760px){header{align-items:flex-start;flex-wrap:wrap}.title{order:-1;flex-basis:100%}main{height:calc(100vh - 112px)}header button,header a.action{padding:7px 8px}.replace-panel{top:120px}.fallback{margin-top:18px}}
  </style>
</head>
<body>
  <header><a class="action" id="back-link" href="/">← 返回研究树</a><button id="close-btn" type="button">关闭</button><div class="title"><strong id="title">本地论文阅读</strong><span id="subtitle"></span></div><a class="action" id="source-link" target="_blank" rel="noreferrer" hidden>打开出版社页面</a><button id="retry-btn" type="button">重新查找开放版本</button><button class="primary" id="choose-btn" type="button">上传本地 PDF</button><input id="pdf-input" type="file" accept="application/pdf" hidden></header>
  <section class="replace-panel" id="replace-panel" hidden><strong>替换当前论文 PDF</strong><span id="file-name"></span><div class="progress" id="upload-progress" hidden><i></i></div><div class="progress-stage" id="progress-stage"></div><div class="replace-actions"><button class="danger" id="cancel-upload" type="button">取消</button><button class="primary" id="confirm-upload" type="button">确认替换</button></div></section>
  <main id="viewer"></main><div class="message" id="message" role="status"></div>
  <script type="module">
    import { accessStatusLabel, analysisBasisLabel, mergePaperAnalysis, normalizePaperAccess, normalizeRelationEvidence } from "./access-model.js";
    const params = new URLSearchParams(location.search), treeId = params.get("tree") || "", paperId = params.get("paper") || "", $ = selector => document.querySelector(selector);
    let workspace, tree, paper, selectedFile = null, uploadController = null, resolving = false;
    function message(text) { $("#message").textContent = text; $("#message").classList.add("show"); clearTimeout(message.timer); message.timer = setTimeout(() => $("#message").classList.remove("show"), 3000); }
    function keyValue() { return sessionStorage.getItem("deepseek-key") || localStorage.getItem("deepseek-key") || ""; }
    function openDb() { return new Promise((resolve, reject) => { const request = indexedDB.open("research-tree-studio", 1); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
    async function loadWorkspace() { const db = await openDb(); workspace = await new Promise((resolve, reject) => { const request = db.transaction("app").objectStore("app").get("workspace"); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); tree = workspace?.trees?.find(item => item.id === treeId); paper = tree?.papers?.find(item => item.id === paperId); if (!paper && params.get("title")) paper = { id: paperId || "shared-paper", title: params.get("title"), titleZh: params.get("titleZh") || "", url: params.get("source") || "", accessUrl: params.get("source") || "", pdfUrl: params.get("pdf") || "", localPdf: params.get("file") || "", accessStatus: params.get("status") || "metadata_only", analysisBasis: params.get("basis") || "metadata", analysisConfidence: Number(params.get("confidence")) || 0, abstract: params.get("abstract") || "" }; if (paper) Object.assign(paper, normalizePaperAccess(paper)); }
    async function saveWorkspace() { if (!workspace) return; workspace.updatedAt = new Date().toISOString(); const db = await openDb(); await new Promise((resolve, reject) => { const tx = db.transaction("app", "readwrite"); tx.objectStore("app").put(workspace, "workspace"); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); }); }
    function broadcast(type = "paper-local-pdf") { new BroadcastChannel("research-tree-studio-sync").postMessage({ type, treeId, paperId, localPdf: paper?.localPdf || "", paper }); }
    function treeContext() { return { name: tree?.name, description: tree?.description, branches: tree?.branches || [], papers: (tree?.papers || []).map(item => ({ id: item.id, title: item.title, year: item.year, branchId: item.branchId, problem: item.problem, analysisBasis: item.analysisBasis })), relations: tree?.relations || [] }; }
    function fallbackActions(container) { const actions = document.createElement("div"); actions.className = "fallback-actions"; if (paper?.accessUrl || paper?.url) { const link = document.createElement("a"); link.className = "action"; link.target = "_blank"; link.rel = "noreferrer"; link.href = paper.accessUrl || paper.url; link.textContent = "打开出版社页面"; actions.append(link); } const retry = document.createElement("button"); retry.textContent = "重新查找开放版本"; retry.onclick = () => resolveOpenPdf(true); const upload = document.createElement("button"); upload.className = "primary"; upload.textContent = "上传本地 PDF"; upload.onclick = () => $("#pdf-input").click(); actions.append(retry, upload); container.append(actions); }
    function renderViewer() { const viewer = $("#viewer"); viewer.replaceChildren(); if (!paper) { const section = document.createElement("section"); section.className = "fallback"; section.innerHTML = "<h1>没有找到论文节点</h1><p>请返回研究树后重新打开论文。</p>"; viewer.append(section); return; } const safeFile = String(paper.localPdf || "").startsWith("/paper-files/") ? paper.localPdf : ""; $("#title").textContent = paper.titleZh || paper.title || "论文"; $("#subtitle").textContent = `${accessStatusLabel(paper.accessStatus)} · ${analysisBasisLabel(paper.analysisBasis)}分析 · 置信度 ${Math.round((paper.analysisConfidence || 0) * 100)}%`; $("#choose-btn").textContent = safeFile ? "替换本地 PDF" : "上传本地 PDF"; if (safeFile) { const frame = document.createElement("iframe"); frame.src = `${safeFile}#view=FitH`; frame.title = paper.title || "论文"; viewer.append(frame); return; } const section = document.createElement("section"); section.className = `fallback ${paper.accessStatus === "institutional_required" ? "locked" : ""}`; const heading = document.createElement("h1"); heading.textContent = paper.titleZh || paper.title; const status = document.createElement("p"); status.className = "status-line"; status.textContent = accessStatusLabel(paper.accessStatus); const detail = document.createElement("p"); if (paper.accessStatus === "institutional_required") detail.textContent = "该论文可能需要学校或机构权限。你可以通过校园网、学校 VPN 或图书馆登录后在外部页面自行下载；本系统不会要求或保存学校账号、密码和 Cookie。"; else if (paper.accessStatus === "abstract_only") detail.textContent = "当前分析仅基于摘要，方法、贡献与论文关系仍需全文确认。"; else if (paper.accessStatus === "metadata_only") detail.textContent = "当前只显示可靠元数据，不会生成伪造的全文结论。"; else detail.textContent = paper.accessMessage || "暂时没有找到可靠全文，可手动补充。"; section.append(heading, status, detail); if (paper.abstract) { const abstract = document.createElement("p"); abstract.className = "abstract"; abstract.textContent = `摘要：${paper.abstract}`; section.append(abstract); } fallbackActions(section); viewer.append(section); }
    async function resolveOpenPdf(force = false) { if (!paper || resolving || (paper.localPdf && !force)) return; resolving = true; $("#retry-btn").disabled = true; $("#subtitle").textContent = "正在重新查找开放版本"; try { const response = await fetch("/api/papers/cache-batch", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ papers: [{ id: paper.id, title: paper.title, abstract: paper.abstract, accessUrl: paper.accessUrl, url: paper.url, pdfUrl: paper.pdfUrl, accessStatus: paper.accessStatus }] }) }); const result = await response.json().catch(() => ({})); if (!response.ok) throw new Error(result.error || "自动获取失败。"); Object.assign(paper, normalizePaperAccess({ ...paper, ...(result.papers?.[0] || {}) })); await saveWorkspace(); broadcast(); message(paper.localPdf ? "已获取开放 PDF 并保存到本地。" : paper.accessStatus === "institutional_required" ? "未发现开放 PDF，已标记为需要机构权限。" : "未发现开放 PDF，已保留当前可靠信息。"); } catch (error) { message(error.message); } finally { resolving = false; $("#retry-btn").disabled = false; renderViewer(); } }
    function resetReplacement() { selectedFile = null; uploadController = null; $("#pdf-input").value = ""; $("#replace-panel").hidden = true; $("#upload-progress").hidden = true; $("#upload-progress i").style.width = "0"; $("#progress-stage").textContent = ""; $("#confirm-upload").disabled = false; $("#confirm-upload").textContent = "确认替换"; }
    function setProgress(percent, stage) { $("#upload-progress").hidden = false; $("#upload-progress i").style.width = `${percent}%`; $("#progress-stage").textContent = stage; }
    function toBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result).split(",")[1]); reader.onerror = () => reject(reader.error); reader.onabort = () => reject(new DOMException("用户已取消。", "AbortError")); reader.readAsDataURL(file); uploadController?.signal.addEventListener("abort", () => reader.abort(), { once: true }); }); }
    async function saveUploadedPdf(data, name) { const response = await fetch("/api/papers/upload", { method: "POST", signal: uploadController.signal, headers: { "content-type": "application/json" }, body: JSON.stringify({ name, data }) }); const result = await response.json().catch(() => ({})); if (!response.ok) throw new Error(result.error || "PDF 保存失败。"); return result.localPdf; }
    async function uploadAndAnalyze() { if (!selectedFile || !paper) return; uploadController = new AbortController(); $("#confirm-upload").disabled = true; $("#confirm-upload").textContent = "处理中"; try { setProgress(15, "读取 PDF"); const data = await toBase64(selectedFile); const key = keyValue(); if (key) { setProgress(42, "分析全文并重建论文关系"); const response = await fetch("/api/deepseek/analyze", { method: "POST", signal: uploadController.signal, headers: { "content-type": "application/json", "x-deepseek-key": key }, body: JSON.stringify({ model: workspace.settings?.model, depth: workspace.settings?.depth, file: { name: selectedFile.name, data }, analysisBasis: "fulltext", accessSource: "manual", treeContext: treeContext() }) }); const result = await response.json().catch(() => ({})); if (!response.ok) throw new Error(result.error || "全文分析失败。"); setProgress(88, "更新原论文节点"); const existingId = paper.id, branchId = tree.branches.some(item => item.id === result.data.placement.branchId) ? result.data.placement.branchId : paper.branchId; Object.assign(paper, mergePaperAnalysis(paper, { ...result.data.paper, branchId }, { localPdf: result.data.paper.localPdf, accessStatus: "local_pdf", accessSource: "manual", analysisBasis: "fulltext", analysisConfidence: result.data.paper.analysisConfidence, accessMessage: "已上传本地全文，并基于全文重新分析。" })); tree.relations = tree.relations.filter(relation => relation.sourceId !== existingId && relation.targetId !== existingId); for (const relation of result.data.relations || []) { if (!tree.papers.some(item => item.id === relation.targetPaperId)) continue; const sourceId = relation.direction === "from_target_to_new" ? relation.targetPaperId : existingId, targetId = relation.direction === "from_target_to_new" ? existingId : relation.targetPaperId; tree.relations.push(normalizeRelationEvidence({ id: `rel-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, sourceId, targetId, type: relation.type, explanation: relation.explanation, confidence: relation.confidence, analysisBasis: "fulltext" }, tree.papers)); } message("已替换 PDF，并用全文更新原论文节点与关系。"); } else { setProgress(48, "保存本地 PDF"); const localPdf = await saveUploadedPdf(data, selectedFile.name); Object.assign(paper, normalizePaperAccess({ ...paper, localPdf, accessStatus: "local_pdf", accessSource: "manual", accessMessage: "已有本地全文；配置 DeepSeek API Key 后可重新进行全文分析。" })); message("PDF 已替换；未配置 DeepSeek Key，原分析结论暂未改变。"); } setProgress(100, "完成"); await saveWorkspace(); broadcast("paper-reanalyzed"); renderViewer(); resetReplacement(); } catch (error) { if (error.name !== "AbortError") message(error.message); resetReplacement(); } }
    await loadWorkspace(); const title = paper?.titleZh || paper?.title || params.get("title") || "论文"; document.title = `${title} - 本地论文阅读`; $("#title").textContent = title; $("#back-link").href = treeId ? `/#tree=${encodeURIComponent(treeId)}` : "/"; $("#close-btn").onclick = () => window.close(); const source = paper?.accessUrl || paper?.url || params.get("source") || ""; if (source) { $("#source-link").href = source; $("#source-link").hidden = false; } $("#choose-btn").onclick = () => $("#pdf-input").click(); $("#retry-btn").onclick = () => resolveOpenPdf(true); $("#pdf-input").onchange = event => { const file = event.target.files[0]; if (!file) return resetReplacement(); if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) return message("请选择 PDF 文件。"); selectedFile = file; $("#file-name").textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} MB`; $("#replace-panel").hidden = false; }; $("#cancel-upload").onclick = () => { uploadController?.abort(); resetReplacement(); }; $("#confirm-upload").onclick = uploadAndAnalyze; renderViewer(); if (paper && !paper.localPdf && paper.accessStatus === "open_pdf") await resolveOpenPdf();
  </script>
</body>
</html>
